<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khalid Abdulaziz Yassen Almaktari - Digital Business Card</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <!-- Main Card Container -->
        <div class="card-container">

            <!-- Top Logo Box -->
            <div class="logo-card">
                <img src="assets/logo.png" alt="شركة المطاحن الرابعة - MC4 Logo" class="company-logo">
            </div>

            <!-- Inner Profile Container -->
            <div class="inner-card">

                <!-- Google Account Profile Photo -->
                <div class="profile-photo-wrapper">
                    <img src="assets/google-user-icon.svg" alt="Google Account Avatar" class="profile-photo" id="profileImg">
                </div>

                <!-- Name & Role -->
                <h1 class="profile-name">Khalid Al-Maktary</h1>
                <p class="full-name-sub">Khalid Abdulaziz Yassen Almaktari</p>
                <div class="profile-role">
                    <span class="role-title">Role</span>
                    <span class="dot">•</span>
                    <span class="role-desc">Chief Executive Officer</span>
                </div>

                <!-- Contact Info Links -->
                <div class="contact-links">
                    <a href="mailto:k.almaktary@mc4.com.sa" class="contact-item">
                        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2"/>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                        </svg>
                        <span>k.almaktary@mc4.com.sa</span>
                    </a>

                    <a href="tel:558846006" class="contact-item">
                        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                        </svg>
                        <span>558846006</span>
                    </a>
                </div>

                <!-- Download Contact Button -->
                <button class="btn-download-vcard" onclick="downloadVCard()">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span>Download Contact</span>
                </button>

                <!-- Action Social Buttons -->
                <div class="social-buttons">
                    <!-- WhatsApp Button -->
                    <a href="https://wa.me/966558846006" target="_blank" class="social-btn btn-whatsapp">
                        <div class="social-btn-content">
                            <div class="icon-circle icon-whatsapp">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.99c-.002 5.45-4.437 9.887-9.885 9.887m0-18.177C6.012 3.608 1.01 8.61 1.008 14.811c0 2.11.58 4.168 1.68 5.962L1 26.5l5.882-1.543a11.166 11.166 0 005.32 1.353h.005c6.202 0 11.206-5.003 11.208-11.205 0-2.989-1.164-5.801-3.276-7.915a11.144 11.144 0 00-7.933-3.284"/>
                                </svg>
                            </div>
                            <span class="social-btn-label">WHATSAPP</span>
                        </div>
                        <svg class="external-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                    </a>

                    <!-- LinkedIn Button -->
                    <a href="https://linkedin.com" target="_blank" class="social-btn btn-linkedin">
                        <div class="social-btn-content">
                            <div class="icon-circle icon-linkedin">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
                                </svg>
                            </div>
                            <span class="social-btn-label">Linkedin</span>
                        </div>
                        <svg class="external-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                    </a>
                </div>

                <!-- QR Code Box with Hover Download Overlay -->
                <div class="qr-container">
                    <div class="qr-code-box" id="qrCodeContainer" onclick="openQRModal()" title="Click to view & download QR Code">
                        <!-- Dynamic QR Image inserted by JS -->
                        <div class="qr-overlay">
                            <svg class="qr-download-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                        </div>
                    </div>

                    <!-- Link Copy Pill -->
                    <button class="link-pill" onclick="copyLink('link.zuccess.ai/aay')">
                        <span id="linkText">link.zuccess.ai/aay</span>
                        <svg class="copy-icon" id="copyIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                        </svg>
                    </button>
                </div>

            </div>

            <!-- Footer Text -->
            <footer class="card-footer">
                <span>Created by Musab - +967 773219299</span>
            </footer>

        </div>
    </div>

    <!-- Fullscreen QR Code Modal Overlay -->
    <div id="qrModal" class="qr-modal-overlay" onclick="closeQRModal()">
        <div class="qr-modal-card" onclick="event.stopPropagation()">
            <button class="qr-modal-close" onclick="closeQRModal()">&times;</button>
            <h2 class="qr-modal-title">Scan QR Code</h2>
            <div id="modalQRContainer" class="modal-qr-box"></div>
            <p class="qr-modal-sub">Khalid Abdulaziz Yassen Almaktari</p>
            <p class="qr-modal-url">link.zuccess.ai/aay</p>
            
            <button class="btn-download-qr" onclick="downloadQRImage()">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span>Download QR Image</span>
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Link copied to clipboard!</div>

    <script src="script.js"></script>
</body>
</html>
